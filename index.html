<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XO &amp; OX</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= HOME OVERLAY (หน้าแรก + Global Win Streak Rank) ================= -->
  <div id="home-overlay" class="home-overlay">
    <div class="home-card">
      <div class="home-logo">
        <span class="logo-x">✕</span>
        <span class="logo-o">○</span>
      </div>
      <h1 class="home-title">TIC-TAC-TOE</h1>
      <p class="home-subtitle">Classic &amp; Online Multiplayer</p>

      <!-- ช่องตั้งชื่อเล่น & ป้าย Best Win Streak -->
      <div class="home-field">
        <label for="nickname-input" class="home-label">Nickname</label>
        <input type="text" id="nickname-input" class="home-input" placeholder="Player 1" maxlength="15" />
        <div id="home-best-streak" class="best-streak-badge" style="display: none;">
          🔥 Your Best Streak: <span id="best-streak-value">0</span> Wins
        </div>
      </div>

      <!-- ปุ่มเลือกโหมดเล่น -->
      <div class="home-actions">
        <button type="button" id="home-play-ai-btn" class="home-btn home-btn-primary">
          🤖 Play vs AI
        </button>

        <button type="button" id="home-create-room-btn" class="home-btn home-btn-outline">
          🌐 Create Online Room
        </button>

        <div class="home-join-group">
          <input type="text" id="home-room-code-input" class="home-input home-code-input" placeholder="0000" maxlength="4" inputmode="numeric" />
          <button type="button" id="home-join-room-btn" class="home-btn home-btn-secondary">
            Join Room
          </button>
        </div>
      </div>

      <!-- ตารางจัดอันดับ Global Win Streak -->
      <div class="leaderboard-box">
        <div class="leaderboard-title">🏆 Top Win Streaks</div>
        <ul id="leaderboard-list" class="leaderboard-list">
          <li class="leaderboard-empty">Loading...</li>
        </ul>
      </div>
    </div>
  </div>
  <!-- =================================================================================== -->

  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">
          <span id="player-role-label">You are</span> <span class="mark-x" id="mark-x">X</span> &middot; 
          <span id="opponent-role-label">Computer is</span> <span class="mark-o" id="mark-o">O</span>
        </p>
      </div>

      <div class="header-right">
        <div class="timer" aria-label="Match timer">
          <span class="timer-icon" aria-hidden="true">⏱</span>
          <span id="timer-value" class="timer-value">00:00</span>
        </div>

        <div class="scoreboard" aria-label="Scoreboard">
          <div class="score-item">
            <span class="score-value" id="score-player">0</span>
            <span class="score-label" id="score-label-player">You (X)</span>
          </div>
          <div class="score-item">
            <span class="score-value" id="score-ties">0</span>
            <span class="score-label">Ties</span>
          </div>
          <div class="score-item">
            <span class="score-value" id="score-ai">0</span>
            <span class="score-label" id="score-label-ai">AI (O)</span>
          </div>
        </div>

        <button type="button" id="mute-btn" class="icon-btn" aria-label="Mute sound" aria-pressed="false">🔊</button>
        <button type="button" id="home-nav-btn" class="icon-btn" aria-label="Back to Home" title="กลับหน้าแรก">🏠</button>
      </div>
    </header>

    <!-- แถบแจ้งสถานะห้องออนไลน์ & ปุ่ม Copy Link -->
    <div id="online-room-bar" class="online-room-bar" style="display: none;">
      <span id="room-info-text" class="room-info-text">Room #0000</span>
      <button type="button" id="copy-link-btn" class="copy-link-btn">📋 Copy Link</button>
    </div>

    <!-- Board container -->
    <main class="board-container">
      <p id="status" class="status" role="status" aria-live="polite">Your turn (X)</p>

      <div id="board" class="board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>

      <p class="kbd-hint">Tip: press <kbd>1</kbd>&ndash;<kbd>9</kbd> to play &middot; <kbd>R</kbd> to restart</p>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-controls">
        <div class="first-player" id="first-player-control" role="group" aria-label="Choose who goes first">
          <span class="first-player-label">First move:</span>
          <div class="first-player-toggle">
            <button type="button" class="toggle-btn" id="first-player-human" data-player="human" aria-pressed="true">You (X)</button>
            <button type="button" class="toggle-btn" id="first-player-ai" data-player="ai" aria-pressed="false">AI (O)</button>
          </div>
        </div>

        <div class="skin-picker">
          <span class="skin-label">Skin:</span>
          <button type="button" id="skin-btn" class="skin-btn" aria-label="Change player symbols">X O</button>
        </div>

        <div class="difficulty" aria-label="Game mode">
          <span class="difficulty-label">Mode:</span>
          <span class="difficulty-badge" id="mode-badge">Minimax AI &middot; Unbeatable</span>
        </div>
      </div>

      <button id="restart-btn" class="restart-btn">Play Again</button>
    </footer>

  </div>

  <script src="js/gameEngine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/effects.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
